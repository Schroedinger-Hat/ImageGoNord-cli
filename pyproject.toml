[tool.poetry]
name = "image-go-nord-client"
version = "1.0.0"
description = "A modern CLI client for converting images to Nord palettes with ImageGoNord"
authors = ["TheJoin95", "Wabri"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/schroedinger-Hat/ImageGoNord-cli"
keywords = ["cli", "image", "nord", "palette", "converter"]
packages = [{ include = "image_go_nord_client", from = "src" }]
include = [
  "src/image_go_nord_client/VERSION",
  "src/image_go_nord_client/palettes/**/*.txt",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
image-go-nord = "0.1.5"
Pillow = ">=10.4,<12.0"
typer = "0.12.3"
rich = "13.7.1"

[tool.poetry.scripts]
image-go-nord-client = "image_go_nord_client.main:main"
ign = "image_go_nord_client.ign:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
